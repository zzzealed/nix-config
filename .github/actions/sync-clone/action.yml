name: Sync clone
description: Clone or update zzzealed/nix-config 
inputs:
  path:
    required: true
    description: Local path of the clone
runs:
  using: composite
  steps:
    - name: clone or update
      shell: bash
      run: |
        repo="${{ inputs.path }}"
        if [ -d "$repo/.git" ]; then
          git -C "$repo" fetch origin main
          git -C "$repo" reset --hard origin/main
        else
          git clone https://github.com/zzzealed/nix-config "$repo"
        fi
